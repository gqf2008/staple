[package]
name = "staple-app"
description = "Staple Topcoat application entrypoint (routes, middleware, config)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
staple-adapters = { path = "../adapters" }
staple-data = { path = "../data" }
staple-domain = { path = "../domain" }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
cron = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
topcoat = { version = "0.5.0", features = ["multipart"] }
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
