[package]
name = "staple-data"
description = "Staple Turso/libSQL data layer: schema, migrations, repositories"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
libsql = "0.9.30"
rand = "0.8"
sha2 = "0.10"
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
